services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ats_admin_frontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000/api
    restart: unless-stopped
